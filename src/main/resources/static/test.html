<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>테스트 도구</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f1117; color: #e2e8f0; min-height: 100vh; }

    header {
      background: #1a1d2e; border-bottom: 1px solid #2d3748;
      padding: 16px 32px; display: flex; align-items: center; gap: 12px;
    }
    header h1 { font-size: 1.2rem; color: #58a6ff; }
    header span { font-size: 0.8rem; color: #64748b; }

    .token-bar {
      background: #12151f; border-bottom: 1px solid #1e2535;
      padding: 8px 32px; font-size: 0.75rem; color: #64748b;
      display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
    }
    .t-label { color: #475569; }
    .t-val { color: #34d399; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .t-val.empty { color: #4b5563; font-style: italic; }

    .tabs { display: flex; gap: 4px; padding: 16px 32px 0; border-bottom: 1px solid #1e2535; flex-wrap: wrap; }
    .tab-btn {
      padding: 8px 20px; border: none; background: transparent; color: #64748b;
      cursor: pointer; font-size: 0.9rem; border-radius: 6px 6px 0 0;
      border-bottom: 2px solid transparent; transition: all 0.15s;
    }
    .tab-btn:hover { color: #58a6ff; }
    .tab-btn.active { color: #58a6ff; border-bottom-color: #58a6ff; background: #1a1d2e; }

    .tab-content { display: none; padding: 24px 32px; }
    .tab-content.active { display: block; }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 20px; }

    .card { background: #1a1d2e; border: 1px solid #2d3748; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .card h3 { font-size: 0.9rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; }

    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group label { font-size: 0.8rem; color: #64748b; }
    .form-group input[type="text"],
    .form-group input[type="password"] {
      width: 100%; background: #0f1117; border: 1px solid #2d3748;
      border-radius: 6px; padding: 8px 12px; color: #e2e8f0;
      font-size: 0.9rem; outline: none; transition: border-color 0.15s;
    }
    .form-group input:focus { border-color: #58a6ff; }

    .btn {
      padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer;
      font-size: 0.85rem; font-weight: 500; transition: all 0.15s;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary   { background: #238636; color: #fff; }
    .btn-primary:hover:not(:disabled)   { background: #2ea043; }
    .btn-secondary { background: #1e2535; color: #94a3b8; border: 1px solid #2d3748; }
    .btn-secondary:hover:not(:disabled) { background: #252d42; }
    .btn-full { width: 100%; }

    .info-box {
      background: #0f172a; border: 1px solid #1e3a5f; border-radius: 6px;
      padding: 10px 14px; font-size: 0.8rem; color: #60a5fa;
      line-height: 1.6; white-space: pre-wrap; word-break: break-all;
    }
    .info-box.success { background: #022c22; border-color: #065f46; color: #6ee7b7; }
    .info-box.error   { background: #2a0f0f; border-color: #7f1d1d; color: #f87171; }
    .info-box.warn    { background: #1c1200; border-color: #78350f; color: #fbbf24; }
    .hidden { display: none !important; }

    .banner-preview {
      width: 100%; height: 130px; border-radius: 8px; overflow: hidden;
      background: linear-gradient(135deg,#1a1d2e 0%,#2d3748 100%);
      border: 1px solid #2d3748;
    }
    .banner-preview img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .banner-hint { font-size: 0.75rem; color: #475569; }

    .spinner {
      width: 14px; height: 14px; border: 2px solid #ffffff40;
      border-top-color: #fff; border-radius: 50%; animation: spin .6s linear infinite; display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<header>
  <h1>테스트 도구</h1>
  <span>profileBanner 변경</span>
</header>

<div class="token-bar">
  <span class="t-label">Access Token</span>
  <span class="t-val empty" id="tokenDisplay">없음 — 먼저 로그인하세요</span>
</div>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('login')">로그인</button>
  <button class="tab-btn" id="tabBanner" onclick="switchTab('banner')">배너 변경</button>
</div>

<!-- 로그인 탭 -->
<div id="tab-login" class="tab-content active">
  <div class="grid">
    <div class="card">
      <h3>로그인</h3>
      <div class="form-group">
        <label>ID (customId 또는 adminId)</label>
        <input id="loginId" type="text" placeholder="아이디" />
      </div>
      <div class="form-group">
        <label>비밀번호</label>
        <input id="loginPw" type="password" placeholder="비밀번호" />
      </div>
      <button class="btn btn-primary btn-full" onclick="doLogin()">로그인</button>
      <div id="loginStatus" class="info-box hidden"></div>
    </div>
  </div>
</div>

<!-- 배너 변경 탭 -->
<div id="tab-banner" class="tab-content">
  <div class="grid">
    <div class="card">
      <h3>profileBanner 변경</h3>
      <div class="form-group">
        <label>UUID</label>
        <input id="bannerUuid" type="text" placeholder="대상 사용자 UUID" />
      </div>
      <div class="form-group">
        <label>배너 이미지 URL</label>
        <input id="bannerUrl" type="text" placeholder="https://example.com/banner.png" oninput="previewBanner()" />
        <span class="banner-hint">URL 입력 시 아래 미리보기에 반영됩니다</span>
      </div>
      <div class="banner-preview" id="bannerPreviewArea">
        <img id="bannerPreviewImg" src="" alt="" style="display:none;" />
      </div>
      <button class="btn btn-primary btn-full" id="bannerBtn" onclick="doBannerUpdate()">배너 저장</button>
      <div id="bannerStatus" class="info-box hidden"></div>
    </div>

    <div class="card">
      <h3>현재 프로필 조회</h3>
      <div class="form-group">
        <label>UUID</label>
        <input id="viewUuid" type="text" placeholder="조회할 사용자 UUID" />
      </div>
      <button class="btn btn-secondary btn-full" onclick="doViewProfile()">조회</button>
      <div id="viewStatus" class="info-box hidden"></div>
    </div>
  </div>
</div>

<script>
  let accessToken = sessionStorage.getItem('accessToken') || null;
  let currentUuid = sessionStorage.getItem('currentUuid') || null;

  function updateTokenBar() {
    const el = document.getElementById('tokenDisplay');
    if (accessToken) {
      el.textContent = accessToken.slice(0, 40) + '…';
      el.classList.remove('empty');
    } else {
      el.textContent = '없음 — 먼저 로그인하세요';
      el.classList.add('empty');
    }
  }
  updateTokenBar();

  function switchTab(name) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById('tab-' + name).classList.add('active');
    event.currentTarget.classList.add('active');
  }

  function setMsg(id, type, msg) {
    const el = document.getElementById(id);
    el.className = 'info-box ' + type;
    el.classList.remove('hidden');
    el.textContent = msg;
  }

  async function apiFetch(method, path, body) {
    const headers = { 'Content-Type': 'application/json' };
    if (accessToken) headers['Authorization'] = 'Bearer ' + accessToken;
    const res = await fetch(path, {
      method,
      headers,
      body: body ? JSON.stringify(body) : undefined,
      credentials: 'include',
    });
    let json = null;
    try { json = await res.json(); } catch (_) {}
    return { ok: res.ok, status: res.status, json };
  }

  async function doLogin() {
    const id = document.getElementById('loginId').value.trim();
    const pw = document.getElementById('loginPw').value;
    if (!id || !pw) { setMsg('loginStatus', 'warn', 'ID와 비밀번호를 입력하세요.'); return; }

    try {
      const r = await apiFetch('POST', '/api/auth/login', { id, password: pw });
      if (!r.ok) { setMsg('loginStatus', 'error', `로그인 실패: ${r.json?.message}`); return; }
      const d = r.json.data;
      accessToken = d.accessToken;
      currentUuid = d.uuid;
      sessionStorage.setItem('accessToken', accessToken);
      sessionStorage.setItem('currentUuid', currentUuid);
      updateTokenBar();
      setMsg('loginStatus', 'success', `로그인 성공\nUUID: ${d.uuid}\n닉네임: ${d.userNickname}`);
      // UUID 자동 입력
      document.getElementById('bannerUuid').value = d.uuid;
      document.getElementById('viewUuid').value = d.uuid;
    } catch (e) {
      setMsg('loginStatus', 'error', '네트워크 오류: ' + e.message);
    }
  }

  function previewBanner() {
    const url = document.getElementById('bannerUrl').value.trim();
    const img = document.getElementById('bannerPreviewImg');
    if (url) {
      img.src = url;
      img.style.display = 'block';
      img.onerror = () => { img.style.display = 'none'; };
    } else {
      img.style.display = 'none';
    }
  }

  async function doBannerUpdate() {
    if (!accessToken) { setMsg('bannerStatus', 'warn', '먼저 로그인하세요.'); return; }
    const uuid = document.getElementById('bannerUuid').value.trim();
    const url  = document.getElementById('bannerUrl').value.trim();
    if (!uuid) { setMsg('bannerStatus', 'warn', 'UUID를 입력하세요.'); return; }
    if (!url)  { setMsg('bannerStatus', 'warn', '배너 URL을 입력하세요.'); return; }

    const btn = document.getElementById('bannerBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> 저장 중…';

    try {
      const r = await apiFetch('PATCH', `/api/users/${uuid}/profile`, { profileBanner: url });
      if (!r.ok) { setMsg('bannerStatus', 'error', `저장 실패 (${r.status}): ${r.json?.message}`); return; }
      setMsg('bannerStatus', 'success', '배너가 저장되었습니다.');
      // 조회 UUID도 동기화
      document.getElementById('viewUuid').value = uuid;
    } catch (e) {
      setMsg('bannerStatus', 'error', '네트워크 오류: ' + e.message);
    } finally {
      btn.disabled = false;
      btn.textContent = '배너 저장';
    }
  }

  async function doViewProfile() {
    const uuid = document.getElementById('viewUuid').value.trim();
    if (!uuid) { setMsg('viewStatus', 'warn', 'UUID를 입력하세요.'); return; }

    try {
      const r = await apiFetch('GET', `/api/users/${uuid}`);
      if (!r.ok) { setMsg('viewStatus', 'error', `조회 실패: ${r.json?.message}`); return; }
      const d = r.json.data;
      const lines = [
        `닉네임: ${d.userNickname ?? '-'}`,
        `프로필 이미지: ${d.profileImage ?? '없음'}`,
        `배너: ${d.profileBanner ?? '없음'}`,
        `소개: ${d.intro ?? '없음'}`,
      ];
      setMsg('viewStatus', 'success', lines.join('\n'));
    } catch (e) {
      setMsg('viewStatus', 'error', '네트워크 오류: ' + e.message);
    }
  }

  // Enter 키 지원
  document.getElementById('loginPw').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  document.getElementById('bannerUrl').addEventListener('keydown', e => { if (e.key === 'Enter') doBannerUpdate(); });
</script>
</body>
</html>
