spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: proj

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      data-source-properties:
        useUnicode: true
        characterEncoding: utf8
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1800000
      keepalive-time: 300000
      connection-timeout: 5000
      validation-timeout: 5000

  mvc:
    throw-exception-if-no-handler-found: true

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        default_batch_fetch_size: 1000
        jdbc:
          time_zone: Asia/Seoul
          batch_size: 50
        order_inserts: true
        order_updates: true

  jackson:
    time-zone: Asia/Seoul

  devtools:
    restart:
      enabled: false
    add-properties: false

  output:
    ansi:
      enabled: always

  web:
    locale: ko_KR
    locale-resolver: fixed

  main:
    lazy-initialization: true

server:
  port: 8080
  address: 0.0.0.0
  error:
    whitelabel:
      enabled: false
  forward-headers-strategy: framework
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  tomcat:
    threads:
      max: 300
      min-spare: 30
    accept-count: 200

logging:
  file:
    name: ${LOG_FILE:logs/app.log}
  charset:
    console: UTF-8
    file: UTF-8
  level:
    root: INFO
    org:
      springframework:
        web: INFO
      hibernate:
        SQL: ERROR
        type:
          descriptor:
            sql:
              BasicBinder: ERROR

jwt:
  secret: ${JWT_SECRET}
  access-expiration-ms: 600000
  refresh-expiration-ms: 604800000

github:
  oauth:
    client-id: ${GITHUB_CLIENT_ID}
    client-secret: ${GITHUB_CLIENT_SECRET}
    # GitHub OAuth App의 Authorization callback URL과 일치해야 합니다.
    callback-url: ${GITHUB_CALLBACK_URL:http://localhost:8080/api/auth/github/callback}
    # 인증 완료 후 리다이렉트할 프론트엔드 도메인
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:8080}
    link-success-path: ${GITHUB_LINK_SUCCESS_PATH:/admin/index.html}
    login-success-path: ${GITHUB_LOGIN_SUCCESS_PATH:/admin/index.html}
    error-path: ${GITHUB_ERROR_PATH:/admin/index.html}

app:
  auto-increment:
    maintain:
      enabled: true
      tables: users,posts,comments,comments_likes,refresh_token,user_data,post_likes,points_usage_history
      resequence-order: false
      order-column: order_no
      resequence-primary:
        enabled: true
        tables: refresh_token,post,post_likes,comments,comments_likes,user_ban,user_report

  cookie:
    http-only: true
    secure: ${COOKIE_SECURE:false}
    same-site: Lax
    max-age: 604800

  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,https://ada-back.com,https://www.ada-back.com}

aws:
  s3:
    # 로컬 개발 시 .env에 AWS_ACCESS_KEY / AWS_SECRET_KEY 설정
    # EC2 IAM Role 환경에서는 두 항목을 비워두거나 제거하세요
    access-key: ${AWS_ACCESS_KEY:}
    secret-key: ${AWS_SECRET_KEY:}
    region: ap-northeast-2
    bucket: gbsw-s3
    max-profile-size-mb: 5
    max-banner-size-mb: 10
