<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>테스트 도구</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f1117; color: #e2e8f0; min-height: 100vh; }

    header {
      background: #1a1d2e; border-bottom: 1px solid #2d3748;
      padding: 16px 32px; display: flex; align-items: center; gap: 12px;
    }
    header h1 { font-size: 1.2rem; color: #58a6ff; }
    header span { font-size: 0.8rem; color: #64748b; }

    .token-bar {
      background: #12151f; border-bottom: 1px solid #1e2535;
      padding: 8px 32px; font-size: 0.75rem; color: #64748b;
      display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
    }
    .token-bar .t-label { color: #475569; }
    .token-bar .t-val { color: #34d399; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .token-bar .t-val.empty { color: #4b5563; font-style: italic; }
    .token-bar .t-role { font-size: 0.7rem; font-weight: 600; padding: 1px 7px; border-radius: 4px; }
    .token-bar .t-role.admin { background: #1a1f6e; color: #79c0ff; border: 1px solid #388bfd; }
    .token-bar .t-role.user  { background: #1c2128; color: #8b949e; border: 1px solid #30363d; }

    .tabs { display: flex; gap: 4px; padding: 16px 32px 0; border-bottom: 1px solid #1e2535; flex-wrap: wrap; }
    .tab-btn {
      padding: 8px 20px; border: none; background: transparent; color: #64748b;
      cursor: pointer; font-size: 0.9rem; border-radius: 6px 6px 0 0;
      border-bottom: 2px solid transparent; transition: all 0.15s;
    }
    .tab-btn:hover { color: #58a6ff; }
    .tab-btn.active { color: #58a6ff; border-bottom-color: #58a6ff; background: #1a1d2e; }
    .tab-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .tab-btn:disabled:hover { color: #64748b; }

    .tab-content { display: none; padding: 24px 32px; }
    .tab-content.active { display: block; }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 20px; }

    .card { background: #1a1d2e; border: 1px solid #2d3748; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .card h3 { font-size: 0.9rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; }

    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group label { font-size: 0.8rem; color: #64748b; }
    .form-group input[type="text"],
    .form-group input[type="password"] {
      width: 100%; background: #0f1117; border: 1px solid #2d3748;
      border-radius: 6px; padding: 8px 12px; color: #e2e8f0;
      font-size: 0.9rem; outline: none; transition: border-color 0.15s;
    }
    .form-group input:focus { border-color: #58a6ff; }

    .btn {
      padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer;
      font-size: 0.85rem; font-weight: 500; transition: all 0.15s; white-space: nowrap;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary   { background: #238636; color: #fff; }
    .btn-primary:hover:not(:disabled)   { background: #2ea043; }
    .btn-secondary { background: #1e2535; color: #94a3b8; border: 1px solid #2d3748; }
    .btn-secondary:hover:not(:disabled) { background: #252d42; }
    .btn-danger    { background: #3d2424; color: #f85149; border: 1px solid #30363d; }
    .btn-danger:hover:not(:disabled)    { background: #4a2020; border-color: #f85149; }
    .btn-github    { background: #21262d; color: #e6edf3; border: 1px solid #30363d; }
    .btn-github:hover:not(:disabled)    { background: #30363d; }
    .btn-full { width: 100%; }

    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn-row .btn { flex: 1; }

    .or-divider { display: flex; align-items: center; gap: 10px; color: #475569; font-size: 12px; }
    .or-divider::before, .or-divider::after { content: ''; flex: 1; border-top: 1px solid #2d3748; }

    .info-box {
      background: #0f172a; border: 1px solid #1e3a5f; border-radius: 6px;
      padding: 10px 14px; font-size: 0.8rem; color: #60a5fa;
      line-height: 1.6; white-space: pre-wrap; word-break: break-all;
    }
    .info-box.success { background: #022c22; border-color: #065f46; color: #6ee7b7; }
    .info-box.error   { background: #2a0f0f; border-color: #7f1d1d; color: #f87171; }
    .info-box.warn    { background: #1c1200; border-color: #78350f; color: #fbbf24; }
    .info-box a { color: #60a5fa; }
    .info-box a:hover { text-decoration: underline; }

    .badge-linked   { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 2px 8px; border-radius: 20px; font-weight: 600; background: #0f4429; color: #56d364; border: 1px solid #238636; }
    .badge-unlinked { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 2px 8px; border-radius: 20px; font-weight: 600; background: #2d1b1b; color: #f85149; border: 1px solid #3d2424; }

    /* 파일 드롭 */
    .file-drop {
      border: 2px dashed #2d3748; border-radius: 8px;
      padding: 20px; text-align: center; cursor: pointer;
      transition: border-color .2s; position: relative;
    }
    .file-drop:hover, .file-drop.drag-over { border-color: #58a6ff; }
    .file-drop input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
    }
    .file-drop-text { font-size: 13px; color: #64748b; pointer-events: none; }
    .file-drop-text span { color: #58a6ff; }
    .preview-wrap { display: none; flex-direction: column; align-items: center; gap: 6px; }
    .preview-wrap img { max-width: 100%; max-height: 150px; border-radius: 8px; border: 1px solid #2d3748; object-fit: cover; }
    .preview-name { font-size: 12px; color: #64748b; }

    /* 유저 정보 배지 */
    .user-badge { display: flex; align-items: center; gap: 12px; }
    .user-badge img { width: 40px; height: 40px; border-radius: 50%; border: 1px solid #2d3748; object-fit: cover; }
    .user-badge .uname { font-size: 0.95rem; font-weight: 600; color: #e2e8f0; }
    .user-badge .uuuid { font-size: 0.75rem; color: #475569; margin-top: 2px; }

    /* 프로필 뷰어 */
    .profile-card {
      background: #12151f; border: 1px solid #2d3748; border-radius: 10px; overflow: hidden;
    }
    .profile-banner {
      width: 100%; height: 120px; object-fit: cover; background: #1a1d2e;
      display: block;
    }
    .profile-banner-placeholder { width: 100%; height: 120px; background: linear-gradient(135deg, #1a1d2e 0%, #2d3748 100%); }
    .profile-body { padding: 16px; display: flex; flex-direction: column; gap: 8px; }
    .profile-avatar-wrap { display: flex; align-items: flex-end; gap: 12px; margin-top: -32px; }
    .profile-avatar { width: 64px; height: 64px; border-radius: 50%; border: 3px solid #12151f; object-fit: cover; background: #1a1d2e; }
    .profile-info { display: flex; flex-direction: column; gap: 4px; }
    .profile-name { font-size: 1rem; font-weight: 700; color: #e2e8f0; }
    .profile-sub  { font-size: 0.78rem; color: #475569; }
    .profile-detail { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 0.8rem; margin-top: 8px; }
    .profile-detail .key { color: #475569; }
    .profile-detail .val { color: #94a3b8; word-break: break-all; }

    .spinner {
      display: inline-block; width: 13px; height: 13px;
      border: 2px solid rgba(255,255,255,.3); border-top-color: #fff;
      border-radius: 50%; animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .hidden { display: none !important; }

    /* 하단 응답 패널 */
    .response-panel {
      position: fixed; bottom: 0; left: 0; right: 0; height: 200px;
      background: #0a0c14; border-top: 1px solid #1e2535;
      display: flex; flex-direction: column;
    }
    .response-header {
      padding: 6px 16px; display: flex; align-items: center; gap: 12px;
      border-bottom: 1px solid #1e2535; flex-shrink: 0;
    }
    .response-header span { font-size: 0.78rem; color: #475569; }
    #responseStatus { font-size: 0.82rem; font-weight: 600; }
    .status-ok  { color: #34d399; }
    .status-err { color: #f87171; }
    #responseBody {
      flex: 1; overflow-y: auto; padding: 10px 16px;
      font-family: 'Fira Code', 'Consolas', monospace;
      font-size: 0.76rem; color: #94a3b8; white-space: pre-wrap; word-break: break-all;
    }
    .spacer { height: 220px; }
  </style>
</head>
<body>

<header>
  <h1>🔧 테스트 도구</h1>
  <span>API Test Page</span>
</header>

<div class="token-bar">
  <span class="t-label">Access Token:</span>
  <span class="t-val empty" id="displayToken">없음</span>
  <span id="displayRole" style="display:none"></span>
  <span class="t-label" style="margin-left:8px">만료:</span>
  <span class="t-val empty" id="displayExp">-</span>
  <button class="btn btn-secondary" style="font-size:0.7rem;padding:3px 10px" onclick="doLogout()">로그아웃</button>
</div>

<div class="tabs">
  <button class="tab-btn active" id="tab-btn-auth"   onclick="switchTab('auth',   this)">🔑 로그인</button>
  <button class="tab-btn" id="tab-btn-github" onclick="switchTab('github', this)" disabled>🐙 GitHub</button>
  <button class="tab-btn" id="tab-btn-upload" onclick="switchTab('upload', this)" disabled>📦 업로드</button>
  <button class="tab-btn" id="tab-btn-profile" onclick="switchTab('profile', this)" disabled>👤 프로필 조회</button>
</div>

<!-- ══ 로그인 탭 ══════════════════════════════════════════════ -->
<div id="tab-auth" class="tab-content active">
  <div class="grid">

    <!-- 로그인 카드 -->
    <div class="card" id="loginCard">
      <h3>로그인</h3>
      <div class="form-group">
        <label>아이디</label>
        <input id="loginId" type="text" placeholder="admin_id 또는 custom_id" />
      </div>
      <div class="form-group">
        <label>비밀번호</label>
        <input id="loginPw" type="password" placeholder="password" />
      </div>
      <button class="btn btn-primary btn-full" id="loginBtn" onclick="doLogin()">로그인</button>
      <div class="or-divider">또는</div>
      <button class="btn btn-github btn-full" id="githubLoginBtn" onclick="startGithubLogin()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
        GitHub으로 로그인
      </button>
      <div id="loginStatus" class="info-box hidden"></div>
    </div>

    <!-- 세션 카드 (로그인 후) -->
    <div class="card hidden" id="sessionCard">
      <h3>현재 세션</h3>
      <div class="user-badge">
        <img id="userAvatar" src="" alt="" onerror="this.style.display='none'" style="display:none" />
        <div>
          <div class="uname" id="userName">-</div>
          <div class="uuuid" id="userUuid"></div>
        </div>
      </div>
      <div id="sessionInfo" class="info-box">-</div>
      <button class="btn btn-danger btn-full" onclick="doLogout()">로그아웃</button>
    </div>

  </div>
</div>

<!-- ══ GitHub 탭 ══════════════════════════════════════════════ -->
<div id="tab-github" class="tab-content">
  <div class="grid">
    <div class="card">
      <h3>GitHub 연동 상태</h3>
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <span style="font-size:0.85rem;color:#94a3b8">연동 상태</span>
        <span id="linkedBadge" class="badge-unlinked">● 미연동</span>
      </div>
      <div class="btn-row">
        <button class="btn btn-github" id="linkBtn" onclick="startLink()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
          연동하기
        </button>
        <button class="btn btn-danger" id="unlinkBtn" onclick="doUnlink()" style="display:none">연동 해제</button>
      </div>
      <div id="githubStatus" class="info-box hidden"></div>
    </div>
  </div>
</div>

<!-- ══ 업로드 탭 ══════════════════════════════════════════════ -->
<div id="tab-upload" class="tab-content">
  <div class="grid">

    <!-- 파일 선택 카드 -->
    <div class="card">
      <h3>이미지 선택</h3>
      <div class="form-group">
        <label>대상 UUID</label>
        <input id="uploadUuid" type="text" placeholder="업로드 대상 사용자 UUID" />
      </div>

      <div class="form-group">
        <label>프로필 이미지 <span style="color:#475569;font-weight:400">(jpeg/png/gif/webp · 최대 5MB)</span></label>
        <div class="file-drop" id="profileDrop">
          <input type="file" id="profileFile" accept="image/jpeg,image/png,image/gif,image/webp" />
          <div class="file-drop-text">클릭하거나 드래그 · <span>이미지 선택</span></div>
        </div>
        <div class="preview-wrap" id="profilePreviewWrap">
          <img id="profilePreview" src="" alt="미리보기" />
          <div class="preview-name" id="profilePreviewName"></div>
        </div>
      </div>

      <div class="form-group">
        <label>배너 이미지 <span style="color:#475569;font-weight:400">(jpeg/png/gif/webp · 최대 10MB)</span></label>
        <div class="file-drop" id="bannerDrop">
          <input type="file" id="bannerFile" accept="image/jpeg,image/png,image/gif,image/webp" />
          <div class="file-drop-text">클릭하거나 드래그 · <span>이미지 선택</span></div>
        </div>
        <div class="preview-wrap" id="bannerPreviewWrap">
          <img id="bannerPreview" src="" alt="미리보기" />
          <div class="preview-name" id="bannerPreviewName"></div>
        </div>
      </div>

      <button class="btn btn-primary btn-full" id="uploadBtn" onclick="doUpload()">업로드</button>
      <div id="uploadStatus" class="info-box hidden"></div>
    </div>

  </div>
</div>

<!-- ══ 프로필 조회 탭 ══════════════════════════════════════════ -->
<div id="tab-profile" class="tab-content">
  <div class="grid">

    <!-- 조회 입력 카드 -->
    <div class="card">
      <h3>UUID로 조회</h3>
      <div class="form-group">
        <label>UUID</label>
        <input id="viewUuid" type="text" placeholder="조회할 사용자 UUID" />
      </div>
      <button class="btn btn-secondary btn-full" onclick="doViewProfile()">조회</button>
      <div id="profileStatus" class="info-box hidden"></div>
    </div>

    <!-- 프로필 뷰어 카드 -->
    <div class="card hidden" id="profileViewer">
      <h3>프로필</h3>
      <div class="profile-card">
        <div id="profileBannerWrap">
          <div class="profile-banner-placeholder" id="profileBannerPlaceholder"></div>
          <img id="profileBannerImg" src="" alt="banner" class="profile-banner hidden" />
        </div>
        <div class="profile-body">
          <div class="profile-avatar-wrap">
            <img id="profileAvatarImg" src="" alt="avatar" class="profile-avatar" onerror="this.src=''" />
            <div class="profile-info">
              <div class="profile-name" id="profileName">-</div>
              <div class="profile-sub" id="profileHandle">-</div>
            </div>
          </div>
          <div class="profile-detail" id="profileDetail"></div>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- 하단 응답 패널 -->
<div class="response-panel">
  <div class="response-header">
    <span>마지막 응답</span>
    <span id="responseStatus">-</span>
    <span id="responseEndpoint" style="color:#334155;margin-left:4px"></span>
  </div>
  <pre id="responseBody">요청을 보내면 응답이 여기에 표시됩니다.</pre>
</div>
<div class="spacer"></div>

<script>
  const API = window.location.origin;
  let accessToken = sessionStorage.getItem('accessToken') || null;

  // ── 탭 전환 ───────────────────────────────────────────────
  function switchTab(name, btn) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById('tab-' + name).classList.add('active');
    btn.classList.add('active');
  }

  // ── 페이지 로드 ──────────────────────────────────────────
  (async function init() {
    const params = new URLSearchParams(window.location.search);

    if (params.has('access_token')) {
      accessToken = params.get('access_token');
      sessionStorage.setItem('accessToken', accessToken);
      history.replaceState({}, '', location.pathname);
    }
    if (params.has('github_linked')) {
      history.replaceState({}, '', location.pathname);
      if (accessToken) {
        showGithubMsg('success', '✓ GitHub 계정 연동 완료!');
        switchTab('github', document.getElementById('tab-btn-github'));
      }
    }
    if (params.has('error')) {
      setLoginMsg('error', '✗ 오류: ' + decodeURIComponent(params.get('error').replace(/\+/g, ' ')));
      history.replaceState({}, '', location.pathname);
    }

    if (accessToken) {
      await applyLogin();
    }
  })();

  async function applyLogin() {
    const payload = parseJwt(accessToken);
    if (!payload) { clearSession(); return; }

    // 탭 활성화
    ['github', 'upload', 'profile'].forEach(t =>
      document.getElementById('tab-btn-' + t).removeAttribute('disabled')
    );

    // 토큰 바
    const tokenEl = document.getElementById('displayToken');
    tokenEl.textContent = accessToken.slice(0, 40) + '…';
    tokenEl.className = 't-val';
    document.getElementById('displayExp').textContent = formatExp(payload.exp);
    document.getElementById('displayExp').className = 't-val';

    const role = payload.role || 'USER';
    const roleEl = document.getElementById('displayRole');
    roleEl.textContent = role;
    roleEl.className = 't-role ' + (role === 'ADMIN' ? 'admin' : 'user');
    roleEl.style.display = '';

    // 세션 카드
    document.getElementById('loginCard').classList.add('hidden');
    document.getElementById('sessionCard').classList.remove('hidden');
    document.getElementById('userUuid').textContent = payload.sub || '';
    document.getElementById('sessionInfo').textContent =
      `UUID: ${payload.sub}\n역할: ${role}\n만료: ${formatExp(payload.exp)}`;

    // UUID 자동 채우기
    document.getElementById('uploadUuid').value = payload.sub || '';
    document.getElementById('viewUuid').value = payload.sub || '';

    // 프로필 정보 (이름/아바타)
    try {
      const res = await apiFetch('GET', `/api/users/${payload.sub}`);
      if (res.ok) {
        const d = res.json.data;
        if (d) {
          const name = d.userNickname || d.userRealname || d.nickname || d.name || payload.sub;
          document.getElementById('userName').textContent = name;
          const avatar = d.profileImage || d.profileImageUrl;
          if (avatar) {
            const img = document.getElementById('userAvatar');
            img.src = avatar;
            img.style.display = '';
          }
        }
      }
    } catch (_) {}

    await checkGithubStatus();
  }

  function clearSession() {
    sessionStorage.removeItem('accessToken');
    accessToken = null;

    ['github', 'upload', 'profile'].forEach(t =>
      document.getElementById('tab-btn-' + t).setAttribute('disabled', '')
    );

    document.getElementById('loginCard').classList.remove('hidden');
    document.getElementById('sessionCard').classList.add('hidden');

    const tokenEl = document.getElementById('displayToken');
    tokenEl.textContent = '없음'; tokenEl.className = 't-val empty';
    document.getElementById('displayExp').textContent = '-';
    document.getElementById('displayExp').className = 't-val empty';
    document.getElementById('displayRole').style.display = 'none';

    switchTab('auth', document.getElementById('tab-btn-auth'));
  }

  // ── 로그인 ─────────────────────────────────────────────────
  async function doLogin() {
    const id = document.getElementById('loginId').value.trim();
    const pw = document.getElementById('loginPw').value;
    if (!id || !pw) { setLoginMsg('warn', '아이디와 비밀번호를 입력하세요.'); return; }

    const btn = document.getElementById('loginBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> 로그인 중…';

    try {
      const r = await apiFetch('POST', '/api/auth/login', { id, password: pw });
      if (!r.ok) { setLoginMsg('error', `로그인 실패: ${r.json?.message || r.status}`); return; }
      accessToken = r.json.data.accessToken;
      sessionStorage.setItem('accessToken', accessToken);
      await applyLogin();
    } catch (e) {
      setLoginMsg('error', '네트워크 오류: ' + e.message);
    } finally {
      btn.disabled = false;
      btn.textContent = '로그인';
    }
  }

  async function startGithubLogin() {
    document.getElementById('githubLoginBtn').disabled = true;
    setLoginMsg('', 'GitHub 로그인 페이지로 이동 중…');
    try {
      const r = await apiFetch('GET', '/api/auth/github/login');
      if (!r.ok) { setLoginMsg('error', `오류: ${r.json?.message}`); document.getElementById('githubLoginBtn').disabled = false; return; }
      setTimeout(() => { window.location.href = r.json.data.redirectUrl; }, 400);
    } catch (e) {
      setLoginMsg('error', '네트워크 오류: ' + e.message);
      document.getElementById('githubLoginBtn').disabled = false;
    }
  }

  function doLogout() {
    clearSession();
    document.getElementById('loginId').value = '';
    document.getElementById('loginPw').value = '';
  }

  // ── GitHub 연동 ─────────────────────────────────────────────
  async function checkGithubStatus() {
    try {
      const r = await apiFetch('GET', '/api/auth/github/status', null, true);
      if (r.ok) setLinkedState(r.json.data?.githubLinked === true);
    } catch (_) {}
  }

  async function startLink() {
    document.getElementById('linkBtn').disabled = true;
    showGithubMsg('', '연동 URL 요청 중…');
    try {
      const r = await apiFetch('GET', '/api/auth/github/link', null, true);
      if (!r.ok) { showGithubMsg('error', `오류: ${r.json?.message}`); document.getElementById('linkBtn').disabled = false; return; }
      showGithubMsg('', 'GitHub 인증 페이지로 이동합니다…');
      setTimeout(() => { window.location.href = r.json.data.redirectUrl; }, 800);
    } catch (e) {
      showGithubMsg('error', '네트워크 오류: ' + e.message);
      document.getElementById('linkBtn').disabled = false;
    }
  }

  async function doUnlink() {
    if (!confirm('GitHub 연동을 해제하시겠습니까?')) return;
    try {
      const r = await apiFetch('DELETE', '/api/auth/github/unlink', null, true);
      if (!r.ok) { showGithubMsg('error', `오류: ${r.json?.message}`); return; }
      showGithubMsg('success', '✓ GitHub 연동이 해제되었습니다.');
      setLinkedState(false);
    } catch (e) {
      showGithubMsg('error', '네트워크 오류: ' + e.message);
    }
  }

  function setLinkedState(linked) {
    document.getElementById('linkedBadge').textContent = linked ? '● 연동됨' : '● 미연동';
    document.getElementById('linkedBadge').className = linked ? 'badge-linked' : 'badge-unlinked';
    document.getElementById('linkBtn').style.display = linked ? 'none' : '';
    document.getElementById('unlinkBtn').style.display = linked ? '' : 'none';
  }

  // ── 업로드 ───────────────────────────────────────────────────
  async function doUpload() {
    const uuid = document.getElementById('uploadUuid').value.trim();
    const pf = document.getElementById('profileFile').files[0];
    const bf = document.getElementById('bannerFile').files[0];
    if (!uuid) { setUploadMsg('warn', 'UUID를 입력하세요.'); return; }
    if (!pf && !bf) { setUploadMsg('warn', '파일을 선택하세요.'); return; }

    const btn = document.getElementById('uploadBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> 업로드 중…';

    const form = new FormData();
    if (pf) form.append('profileImage', pf);
    if (bf) form.append('banner', bf);

    try {
      const r = await apiFetch('POST', `/api/upload/profile/${uuid}`, form, true);
      if (!r.ok) { setUploadMsg('error', `업로드 실패: ${r.json?.message}`); return; }
      const d = r.json.data;
      const lines = ['✓ 업로드 성공'];
      if (d?.profileImageUrl) lines.push(`🖼️ 프로필: <a href="${d.profileImageUrl}" target="_blank">${d.profileImageUrl}</a>`);
      if (d?.bannerUrl)       lines.push(`🏞️ 배너: <a href="${d.bannerUrl}" target="_blank">${d.bannerUrl}</a>`);
      const el = document.getElementById('uploadStatus');
      el.classList.remove('hidden'); el.className = 'info-box success';
      el.innerHTML = lines.join('\n');

      // 아바타 업데이트
      if (d?.profileImageUrl) { const img = document.getElementById('userAvatar'); img.src = d.profileImageUrl; img.style.display = ''; }

      document.getElementById('profileFile').value = '';
      document.getElementById('bannerFile').value = '';
      document.getElementById('profilePreviewWrap').style.display = 'none';
      document.getElementById('bannerPreviewWrap').style.display = 'none';
    } catch (e) {
      setUploadMsg('error', '네트워크 오류: ' + e.message);
    } finally {
      btn.disabled = false;
      btn.textContent = '업로드';
    }
  }

  // ── 프로필 조회 ──────────────────────────────────────────────
  async function doViewProfile() {
    const uuid = document.getElementById('viewUuid').value.trim();
    if (!uuid) { setProfileMsg('warn', 'UUID를 입력하세요.'); return; }

    try {
      const r = await apiFetch('GET', `/api/users/${uuid}`, null, !!accessToken);
      if (!r.ok) { setProfileMsg('error', `조회 실패: ${r.json?.message || r.status}`); document.getElementById('profileViewer').classList.add('hidden'); return; }

      const d = r.json.data;
      document.getElementById('profileStatus').classList.add('hidden');
      renderProfile(d);
    } catch (e) {
      setProfileMsg('error', '네트워크 오류: ' + e.message);
    }
  }

  function renderProfile(d) {
    const viewer = document.getElementById('profileViewer');
    viewer.classList.remove('hidden');

    // 배너
    const banner = d.banner || d.bannerUrl || d.bannerImage;
    const bannerImg = document.getElementById('profileBannerImg');
    const bannerPh  = document.getElementById('profileBannerPlaceholder');
    if (banner) {
      bannerImg.src = banner;
      bannerImg.classList.remove('hidden');
      bannerPh.classList.add('hidden');
    } else {
      bannerImg.classList.add('hidden');
      bannerPh.classList.remove('hidden');
    }

    // 아바타
    const avatar = d.profileImage || d.profileImageUrl || d.avatar;
    const avatarImg = document.getElementById('profileAvatarImg');
    avatarImg.src = avatar || '';

    // 이름
    document.getElementById('profileName').textContent = d.userNickname || d.nickname || d.userRealname || d.name || '-';
    document.getElementById('profileHandle').textContent = d.customId || d.adminId || d.uuid || d.id || '';

    // 상세 정보
    const skip = new Set(['profileImage','profileImageUrl','avatar','banner','bannerUrl','bannerImage','userNickname','nickname','userRealname','name','customId','adminId']);
    const detail = document.getElementById('profileDetail');
    detail.innerHTML = '';
    for (const [k, v] of Object.entries(d)) {
      if (skip.has(k) || v === null || v === undefined) continue;
      const keyEl = document.createElement('div'); keyEl.className = 'key'; keyEl.textContent = k;
      const valEl = document.createElement('div'); valEl.className = 'val'; valEl.textContent = typeof v === 'object' ? JSON.stringify(v) : String(v);
      detail.appendChild(keyEl);
      detail.appendChild(valEl);
    }
  }

  // ── 파일 미리보기 ────────────────────────────────────────────
  function setupPreview(inputId, previewId, wrapId, nameId, dropId) {
    const input = document.getElementById(inputId);
    input.addEventListener('change', () => {
      const file = input.files[0];
      if (!file) return;
      document.getElementById(previewId).src = URL.createObjectURL(file);
      document.getElementById(nameId).textContent = `${file.name}  (${(file.size/1024).toFixed(1)} KB)`;
      document.getElementById(wrapId).style.display = 'flex';
    });
    const drop = document.getElementById(dropId);
    drop.addEventListener('dragover',  e => { e.preventDefault(); drop.classList.add('drag-over'); });
    drop.addEventListener('dragleave', ()  => drop.classList.remove('drag-over'));
    drop.addEventListener('drop',      e  => { e.preventDefault(); drop.classList.remove('drag-over'); });
  }
  setupPreview('profileFile','profilePreview','profilePreviewWrap','profilePreviewName','profileDrop');
  setupPreview('bannerFile', 'bannerPreview', 'bannerPreviewWrap', 'bannerPreviewName', 'bannerDrop');

  // ── 공통 fetch 헬퍼 ─────────────────────────────────────────
  async function apiFetch(method, path, body, withAuth) {
    const headers = {};
    if (withAuth && accessToken) headers['Authorization'] = 'Bearer ' + accessToken;

    let reqBody;
    if (body instanceof FormData) {
      reqBody = body;
    } else if (body) {
      headers['Content-Type'] = 'application/json';
      reqBody = JSON.stringify(body);
    }

    const res = await fetch(API + path, { method, headers, body: reqBody, credentials: 'include' });
    let json;
    try { json = await res.json(); } catch (_) { json = {}; }

    // 응답 패널 업데이트
    const statusEl = document.getElementById('responseStatus');
    statusEl.textContent = `${res.status} ${res.statusText}`;
    statusEl.className = res.ok ? 'status-ok' : 'status-err';
    document.getElementById('responseEndpoint').textContent = `${method} ${path}`;
    document.getElementById('responseBody').textContent = JSON.stringify(json, null, 2);

    return { ok: res.ok, status: res.status, json };
  }

  // ── UI 메시지 헬퍼 ───────────────────────────────────────────
  function setMsg(id, type, text) {
    const el = document.getElementById(id);
    el.className = 'info-box' + (type ? ' ' + type : '');
    el.classList.remove('hidden');
    el.textContent = text;
  }
  const setLoginMsg  = (t, txt) => setMsg('loginStatus', t, txt);
  const showGithubMsg = (t, txt) => setMsg('githubStatus', t, txt);
  const setUploadMsg = (t, txt) => setMsg('uploadStatus', t, txt);
  const setProfileMsg = (t, txt) => setMsg('profileStatus', t, txt);

  // ── JWT / 날짜 ──────────────────────────────────────────────
  function parseJwt(token) {
    try { return JSON.parse(atob(token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))); }
    catch (_) { return null; }
  }
  function formatExp(exp) {
    if (!exp) return '-';
    return new Date(exp * 1000).toLocaleString('ko-KR');
  }

  // ── Enter 키 ────────────────────────────────────────────────
  ['loginId','loginPw'].forEach(id =>
    document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); })
  );
  document.getElementById('viewUuid').addEventListener('keydown', e => { if (e.key === 'Enter') doViewProfile(); });
</script>
</body>
