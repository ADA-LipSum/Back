<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>S3 업로드 테스트</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      padding: 40px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    h1 { font-size: 20px; font-weight: 700; color: #f0f6fc; }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 28px;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      color: #f0f6fc;
      padding-bottom: 12px;
      border-bottom: 1px solid #30363d;
    }

    label { display: block; font-size: 12px; color: #8b949e; margin-bottom: 6px; }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 8px 12px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #e6edf3;
      font-size: 14px;
      outline: none;
    }

    input[type="text"]:focus,
    input[type="password"]:focus { border-color: #388bfd; }

    .file-drop {
      border: 2px dashed #30363d;
      border-radius: 8px;
      padding: 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s;
      position: relative;
    }

    .file-drop:hover, .file-drop.drag-over { border-color: #388bfd; }

    .file-drop input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .file-drop-text { font-size: 13px; color: #8b949e; pointer-events: none; }
    .file-drop-text span { color: #388bfd; }

    .preview-wrap {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .preview-wrap img {
      max-width: 100%;
      max-height: 180px;
      border-radius: 8px;
      border: 1px solid #30363d;
      object-fit: cover;
    }

    .preview-name { font-size: 12px; color: #8b949e; }

    button {
      width: 100%;
      padding: 10px;
      background: #238636;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover { background: #2ea043; }
    button:disabled { background: #21262d; color: #484f58; cursor: not-allowed; }

    #logout-btn {
      background: #21262d;
      border: 1px solid #30363d;
      color: #8b949e;
      font-size: 12px;
      padding: 6px 12px;
      width: auto;
      align-self: flex-end;
    }

    #logout-btn:hover { background: #30363d; color: #e6edf3; }

    .result-box {
      display: none;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 13px;
      word-break: break-all;
    }

    .result-box.success {
      display: block;
      background: #0f2a1a;
      border: 1px solid #238636;
      color: #3fb950;
    }

    .result-box.error {
      display: block;
      background: #2a0f0f;
      border: 1px solid #da3633;
      color: #f85149;
    }

    .result-box a { color: #388bfd; text-decoration: none; }
    .result-box a:hover { text-decoration: underline; }

    .user-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: #8b949e;
    }

    .user-badge img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid #30363d;
      object-fit: cover;
    }

    .user-badge .name { color: #e6edf3; font-weight: 600; }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* 업로드 섹션은 로그인 전엔 숨김 */
    #upload-section { display: none; width: 100%; max-width: 480px; display: none; flex-direction: column; gap: 24px; }
  </style>
</head>
<body>

<h1>📦 S3 업로드 테스트</h1>

<!-- 로그인 카드 -->
<div class="card" id="login-card">
  <div class="card-title">🔑 로그인</div>
  <div>
    <label for="login-id">아이디</label>
    <input type="text" id="login-id" placeholder="teacher01" autocomplete="username" />
  </div>
  <div>
    <label for="login-pw">비밀번호</label>
    <input type="password" id="login-pw" placeholder="비밀번호 입력" autocomplete="current-password" />
  </div>
  <button id="login-btn" onclick="doLogin()">로그인</button>
  <div class="result-box" id="login-result"></div>
</div>

<!-- 로그인 후: 유저 정보 + 업로드 카드들 -->
<div id="upload-section">

  <!-- 유저 정보 -->
  <div class="card">
    <div class="card-title">👤 로그인된 계정</div>
    <div class="user-badge">
      <img id="user-avatar" src="" alt="avatar" onerror="this.style.display='none'" />
      <div>
        <div class="name" id="user-name"></div>
        <div id="user-uuid" style="font-size:11px;color:#484f58;margin-top:2px;"></div>
      </div>
    </div>
    <button id="logout-btn" onclick="doLogout()">로그아웃</button>
  </div>

  <!-- 프로필 이미지 선택 -->
  <div class="card">
    <div class="card-title">🖼️ 프로필 이미지 <small style="color:#8b949e;font-weight:400;">(jpeg/png/gif/webp · 최대 5MB)</small></div>
    <div class="file-drop" id="profile-drop">
      <input type="file" id="profile-file" accept="image/jpeg,image/png,image/gif,image/webp" />
      <div class="file-drop-text">클릭하거나 파일을 드래그하세요<br><span>이미지 선택</span></div>
    </div>
    <div class="preview-wrap" id="profile-preview-wrap">
      <img id="profile-preview" src="" alt="미리보기" />
      <div class="preview-name" id="profile-preview-name"></div>
    </div>
  </div>

  <!-- 배너 선택 -->
  <div class="card">
    <div class="card-title">🏞️ 배너 이미지 <small style="color:#8b949e;font-weight:400;">(jpeg/png/gif/webp · 최대 10MB)</small></div>
    <div class="file-drop" id="banner-drop">
      <input type="file" id="banner-file" accept="image/jpeg,image/png,image/gif,image/webp" />
      <div class="file-drop-text">클릭하거나 파일을 드래그하세요<br><span>이미지 선택</span></div>
    </div>
    <div class="preview-wrap" id="banner-preview-wrap">
      <img id="banner-preview" src="" alt="미리보기" />
      <div class="preview-name" id="banner-preview-name"></div>
    </div>
  </div>

  <!-- 수정완료 버튼 -->
  <div class="card">
    <div class="card-title">✅ 프로필 수정완료</div>
    <p style="font-size:13px;color:#8b949e;">위에서 선택한 파일을 S3에 업로드하고 DB에 저장합니다.<br>변경하지 않을 항목은 비워두세요.</p>
    <button id="save-btn" onclick="saveProfile()">프로필 수정완료</button>
    <div class="result-box" id="save-result"></div>
  </div>

</div><!-- /upload-section -->

<script>
  let _token = '';
  let _uuid  = '';

  // ── 로그인 ───────────────────────────────────────────────────
  async function doLogin() {
    const id     = document.getElementById('login-id').value.trim();
    const pw     = document.getElementById('login-pw').value;
    const btn    = document.getElementById('login-btn');
    const result = document.getElementById('login-result');

    result.className = 'result-box';
    result.innerHTML = '';

    if (!id || !pw) { showError(result, '⚠️ 아이디와 비밀번호를 모두 입력해주세요.'); return; }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>로그인 중...';

    try {
      const res  = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, password: pw })
      });

      const contentType = res.headers.get('content-type') || '';
      if (!contentType.includes('application/json')) {
        showError(result, `❌ 서버 오류 (${res.status}): 서버 응답이 올바르지 않습니다.`);
        return;
      }

      const json = await res.json();

      if (res.ok && json.data) {
        _token = json.data.accessToken;
        _uuid  = json.data.uuid;

        const displayName = json.data.userNickname || json.data.userRealname || _uuid;
        document.getElementById('user-name').textContent    = displayName;
        document.getElementById('user-uuid').textContent    = _uuid;
        if (json.data.profileImage) {
          document.getElementById('user-avatar').src = json.data.profileImage;
        }

        document.getElementById('login-card').style.display    = 'none';
        document.getElementById('upload-section').style.display = 'flex';
      } else {
        const msg = json.message || JSON.stringify(json);
        showError(result, `❌ 로그인 실패 (${res.status}): ${msg}`);
      }
    } catch (e) {
      showError(result, `❌ 네트워크 오류: ${e.message}`);
    } finally {
      btn.disabled = false;
      btn.textContent = '로그인';
    }
  }

  // ── 로그아웃 ─────────────────────────────────────────────────
  function doLogout() {
    _token = '';
    _uuid  = '';
    document.getElementById('login-id').value  = '';
    document.getElementById('login-pw').value  = '';
    document.getElementById('login-result').className = 'result-box';
    document.getElementById('login-card').style.display    = '';
    document.getElementById('upload-section').style.display = 'none';
  }

  // ── Enter 키로 로그인 ─────────────────────────────────────────
  ['login-id', 'login-pw'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });
  });

  // ── 파일 미리보기 ────────────────────────────────────────────
  function setupPreview(inputId, imgId, wrapId, nameId) {
    const input = document.getElementById(inputId);
    const img   = document.getElementById(imgId);
    const wrap  = document.getElementById(wrapId);
    const name  = document.getElementById(nameId);

    input.addEventListener('change', () => {
      const file = input.files[0];
      if (!file) return;
      img.src  = URL.createObjectURL(file);
      name.textContent = `${file.name}  (${(file.size / 1024).toFixed(1)} KB)`;
      wrap.style.display = 'flex';
    });
  }

  setupPreview('profile-file', 'profile-preview', 'profile-preview-wrap', 'profile-preview-name');
  setupPreview('banner-file',  'banner-preview',  'banner-preview-wrap',  'banner-preview-name');

  // ── 드래그 앤 드롭 스타일 ─────────────────────────────────────
  ['profile-drop', 'banner-drop'].forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener('dragover',  e => { e.preventDefault(); el.classList.add('drag-over'); });
    el.addEventListener('dragleave', ()  => el.classList.remove('drag-over'));
    el.addEventListener('drop',      e  => { e.preventDefault(); el.classList.remove('drag-over'); });
  });

  // ── 프로필 수정완료 (S3 업로드 + DB 저장 통합) ──────────────
  async function saveProfile() {
    const profileFile = document.getElementById('profile-file').files[0];
    const bannerFile  = document.getElementById('banner-file').files[0];
    const btn         = document.getElementById('save-btn');
    const result      = document.getElementById('save-result');

    result.className = 'result-box';
    result.innerHTML = '';

    if (!profileFile && !bannerFile) {
      showError(result, '⚠️ 프로필 이미지 또는 배너 파일을 최소 하나 선택해주세요.');
      return;
    }

    const formData = new FormData();
    if (profileFile) formData.append('profileImage', profileFile);
    if (bannerFile)  formData.append('banner', bannerFile);

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>저장 중...';

    try {
      const res  = await fetch(`/api/upload/profile/${_uuid}`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${_token}` },
        body: formData
      });

      const contentType = res.headers.get('content-type') || '';
      if (!contentType.includes('application/json')) {
        const text = await res.text();
        showError(result, `❌ 서버 오류 (${res.status}): JSON이 아닌 응답을 받았습니다. 서버 배포 상태를 확인하세요.\n\n${text.slice(0, 200)}`);
        return;
      }

      const json = await res.json();

      if (res.ok && json.data) {
        const lines = [];
        if (json.data.profileImageUrl) {
          lines.push(`🖼️ 프로필: <a href="${json.data.profileImageUrl}" target="_blank" rel="noopener noreferrer">${json.data.profileImageUrl}</a>`);
          document.getElementById('user-avatar').src = json.data.profileImageUrl;
          document.getElementById('user-avatar').style.display = '';
        }
        if (json.data.bannerUrl) {
          lines.push(`🏞️ 배너: <a href="${json.data.bannerUrl}" target="_blank" rel="noopener noreferrer">${json.data.bannerUrl}</a>`);
        }
        result.className = 'result-box success';
        result.innerHTML = `✅ 프로필 수정 완료!<br><br>${lines.join('<br>')}`;

        // 선택 초기화
        document.getElementById('profile-file').value = '';
        document.getElementById('banner-file').value  = '';
        document.getElementById('profile-preview-wrap').style.display = 'none';
        document.getElementById('banner-preview-wrap').style.display  = 'none';
      } else {
        const msg = json.message || json.error || JSON.stringify(json);
        showError(result, `❌ 오류 (${res.status}): ${msg}`);
      }
    } catch (e) {
      showError(result, `❌ 네트워크 오류: ${e.message}`);
    } finally {
      btn.disabled = false;
      btn.textContent = '프로필 수정완료';
    }
  }

  function showError(el, msg) {
    el.className = 'result-box error';
    el.textContent = msg;
  }
</script>
</body>
</html>
